name: Build image on push
 
on:
  push:
    branches: ["**"]
  workflow_dispatch:
 
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
      - name: Checkout agent skills
        uses: ./.github/actions/checkout-agent-skills
 
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
 
      # Needed for the FROM dhi.io/... base image in the Dockerfile
      - name: Login to Docker Hardened Images
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Prepare build metadata
        id: metadata
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/growthbook
          BRANCH: ${{ github.ref_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          mkdir -p buildinfo
          echo "${SHA}" > buildinfo/SHA
          printf '%(%Y-%m-%dT%H:%M:%SZ)T' > buildinfo/DATE
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
 
          # Branch names can contain characters Docker tags don't allow
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9_.-' | cut -c1-120)
 
          TAGS="${IMAGE}:git-${SHA::7}"$'\n'"${IMAGE}:${SAFE_BRANCH}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="$TAGS"$'\n'"${IMAGE}:latest"
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
 
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          platforms: linux/amd64
          build-args: |
            DD_GIT_COMMIT_SHA=${{ steps.metadata.outputs.sha }}
            DD_GIT_REPOSITORY_URL=https://github.com/${{ github.repository }}.git
            DD_VERSION=${{ steps.metadata.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
